services:
  sketchforge:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    ports:
      - "${SKETCHFORGE_PORT:-3100}:80"
    restart: unless-stopped

  collaboration:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      target: builder
    working_dir: /app
    command: ["node", "scripts/collaboration-server.mjs"]
    environment:
      COLLAB_PORT: 3101
    ports:
      - "${SKETCHFORGE_COLLAB_PORT:-3101}:3101"
    restart: unless-stopped
